<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
<style>.h{fill:#1f2328;font:700 15px system-ui,sans-serif}.m{fill:#5b6470;font:10px system-ui,sans-serif}.k{fill:#1f2328;font:11px system-ui,sans-serif}
.h{fill:#e8e6e3}.m{fill:#a2a9b3}.k{fill:#e8e6e3}
</style>
<text class="h" x="16" y="26">I Ching</text>
<text class="m" x="16" y="42">an ancient oracle, cast in Hazel</text>
<svg x="16" y="56" width="132" height="132" viewBox="0 0 512 512"><clipPath id="round"><rect width="512" height="512" rx="88"/></clipPath><g clip-path="url(#round)">

<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#4c2a8a"/><stop offset="0.55" stop-color="#26164a"/><stop offset="1" stop-color="#0e0a1c"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe39a"/><stop offset="1" stop-color="#d49b2e"/></linearGradient>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<circle cx="256" cy="256" r="196" fill="none" stroke="#f3cf73" stroke-opacity="0.32" stroke-width="5"/>
<circle cx="256" cy="256" r="178" fill="none" stroke="#f3cf73" stroke-opacity="0.16" stroke-width="2"/>
<g fill="url(#gold)">
<!-- from the bottom: yang, yin, yang, yin, yang, yin -->
<rect x="126" y="342" width="260" height="28" rx="5"/>
<rect x="126" y="298" width="112" height="28" rx="5"/><rect x="274" y="298" width="112" height="28" rx="5"/>
<rect x="126" y="254" width="260" height="28" rx="5"/>
<rect x="126" y="210" width="112" height="28" rx="5"/><rect x="274" y="210" width="112" height="28" rx="5"/>
<rect x="126" y="166" width="260" height="28" rx="5"/>
<rect x="126" y="122" width="112" height="28" rx="5"/><rect x="274" y="122" width="112" height="28" rx="5"/>
</g>
</g></svg>
<text class="k" x="164" y="84">six lines, by three coins</text>
<text class="k" x="164" y="106">or the yarrow stalks;</text>
<text class="k" x="164" y="128">the hexagram, its changing</text>
<text class="k" x="164" y="150">lines, and the one they make</text>
</svg>
