# (^ticket(791)) How long several builds of hazel-lib.js take to build Gnome world's rules (node/build-time.mjs: the first build and
# the median of five more), interleaved on one runner, three rounds, each in a fresh process. Run by hand: Actions, "build timing",
# naming the builds as name=url pairs.
name: build timing
on:
  workflow_dispatch:
    inputs:
      libs:
        description: "name=url pairs, comma-separated"
        required: true
        default: "hazeljs=https://build.hazel.org/hazeljs/hazel-lib.js"
jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the builds (outside the repository, where a .js loads as a plain script)
        shell: bash
        env:
          LIBS: ${{ inputs.libs }}
        run: |
          IFS=',' read -ra pairs <<< "$LIBS"
          for p in "${pairs[@]}"; do n="${p%%=*}"; u="${p#*=}"; mkdir -p "$RUNNER_TEMP/libs/$n"; curl -fsSL -A "Mozilla/5.0" "$u" -o "$RUNNER_TEMP/libs/$n/hazel-lib.js"; echo "$n: $(wc -c < "$RUNNER_TEMP/libs/$n/hazel-lib.js") bytes from $u"; done
      - name: Time them, interleaved
        shell: bash
        run: |
          set +e
          for round in 1 2 3; do for d in "$RUNNER_TEMP"/libs/*/; do n=$(basename "$d")
            node --stack-size=8000 node/build-time.mjs "$d/hazel-lib.js" "$n" 2>&1 | grep -v '^SLOW PARSE'
          done; done | tee timing.log
          { echo '## build timing'; echo '```'; cat timing.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
