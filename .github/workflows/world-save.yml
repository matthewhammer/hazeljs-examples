# (0.0.101; Matthew, 2026-11-24: "let's do a CI check that the automated tour through the world, including digging, and saving
# and then loading all preserves the state exactly") Gnome world in headless Chrome on a GitHub runner (never on the laptop):
# the 🏃 speed run tours the world, digging; then 💾 save, 🔄 restart, 📂 load, in the same page and in a second one; every part
# of the world's state must be the same as before the save (node/world-save-check.mjs). The artifact world-save has the log,
# result.json (each part's hash), the save file and three pictures. Then the instruction booklet printed to PDF (node/zine-check.mjs):
# each of its sections on one half-letter page; the PDF in the artifact zine.
name: world save check
on:
  workflow_dispatch:
  push:
    paths: ["world/**", "shared/**", "dig/sound.js", "node/world-save-check.mjs", "node/level-check.mjs", "node/zine-check.mjs", "node/cdp.mjs", ".github/workflows/world-save.yml"]
jobs:
  save-load:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serve the site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > server.log 2>&1 &
          sleep 1
      - name: Each level's world, as levels.json records it (0.0.140)
        run: node node/level-check.mjs http://127.0.0.1:8000/ world-save/levels
      - name: Tour, save, restart, load, compare
        run: node node/world-save-check.mjs http://127.0.0.1:8000/ world-save
      - name: The magic carpet's flight, Hazel's Fly.step against the page's JavaScript (ticket 861)
        run: |
          curl -sfL -A "Mozilla/5.0" https://build.hazel.org/hazeljs/hazel-lib.js -o "$RUNNER_TEMP/hazel-lib.js"
          node --stack-size=8000 node/fly-check.mjs "$RUNNER_TEMP/hazel-lib.js" "$RUNNER_TEMP/fly-check.json"
      - name: The booklet, printed
        if: ${{ always() }}
        run: node node/zine-check.mjs http://127.0.0.1:8000/ zine world/manual/
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: world-save
          path: world-save/
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: zine
          path: zine/
