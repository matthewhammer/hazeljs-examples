# (^report(65), 2026-11-25; Matthew: "let's extend with a 4-way comparison for performance: interpreter. hazel-jit as of last
# Thursday. hazel-jit now. plain JS. For a common set of benchmarks, from the hazeljs-examples") each game's own run of states
# (node/package-bench.mjs --runs, the interpreter included), with the library of hazelgrove/hazel hazeljs at 2c4a61560f (all
# of today's changes merged): interpreted (Hazel.runProgram), the jit (Hazel.jitProgram: hazel-jit now), each game's own
# compiled.js (--aot-as-is: compiled ahead of time by hazel-jit on trial/794-games-aot, whose compiler did not change from
# 11-17 to 11-23: hazel-jit as of Thursday 11-19), and plain JS where the game has it (five games). Runs on a push to a
# bench/ branch, so main and the site are untouched.
name: package bench
on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        game: [checkers, go, minesweeper, mahjong, solitaire, mahjong-solitaire, pinball, downhill, bricks, snake, trails, starwave, bugs, dig]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hazelgrove/hazeljs
          ref: 3a4a1cdb2dc1f01135d9f0bc304eb19c4693658c
          path: pkg
      - name: The library with all of today's changes merged (hazeljs at 2c4a61560f)
        run: |
          curl -sfL -A "Mozilla/5.0" https://build.hazel.org/hazeljs/hazel-lib.js -o pkg/hazel-lib.js
          grep -o 'build:"[0-9a-f]*"' pkg/hazel-lib.js | head -1
          grep -q 'build:"2c4a61560f' pkg/hazel-lib.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The machine
        run: |
          mkdir -p bench
          { nproc; grep -m1 'model name' /proc/cpuinfo; node --version; } | tee bench/${{ matrix.game }}-machine.txt
      - name: Four ways, each game's own run of states
        run: |
          ulimit -s unlimited || ulimit -s 65536
          set -o pipefail
          node --stack-size=30000 --max-old-space-size=6000 node/package-bench.mjs ${{ matrix.game }} pkg bench/${{ matrix.game }}-4way.json --runs --aot-as-is | tee bench/${{ matrix.game }}-4way.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: b4way-${{ matrix.game }}
          path: bench/
