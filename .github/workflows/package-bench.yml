# (ticket 853, 2026-11-25; Matthew, on ^report(65) #left: "constructions without arguments... guarded access of modules
# == vs === measure cost of exact Ints and step counts, individually") each game's own run of states (node/package-bench.mjs
# --runs) through the jit of six builds of hazeljs 0.0.13's package, one after another on one runner: the base (loops and JS
# arguments, trial/853-pkg 6d041e9769), then each change on top in turn (constructors without arguments made once, c1; a
# module's members by name, c2; == against a literal as ===, c3), then two bench builds on top of c3 that measure what
# Hazel's meaning costs: Ints as plain JS numbers (noint), and no step counted (nostep). The games' own compiled.js is the
# same file every way, a check on the runner's noise. Runs on a push to a bench/ branch.
name: package bench
on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        game: [checkers, go, minesweeper, mahjong, solitaire, mahjong-solitaire, pinball, downhill, bricks, snake, trails, starwave, bugs, dig]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hazelgrove/hazeljs
          ref: 3a4a1cdb2dc1f01135d9f0bc304eb19c4693658c
          path: pkg-0
      - name: The six builds' libraries
        run: |
          get() { cp -r pkg-0 pkg-$1; curl -sfL -A "Mozilla/5.0" https://build.hazel.org/trial/$2/hazel-lib.js -o pkg-$1/hazel-lib.js; grep -o 'build:"[0-9a-f]*"' pkg-$1/hazel-lib.js | head -1; grep -q "build:\"$3" pkg-$1/hazel-lib.js; }
          get base 853-pkg 6d041e9769
          get c1 853-pkg-c1 a14e698ec8
          get c2 853-pkg-c2 bc9d98db6b
          get c3 853-pkg-c3 f111bb00ac
          get noint 853-pkg-noint b471f761fb
          get nostep 853-pkg-nostep ae9611d03f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The machine
        run: |
          mkdir -p bench
          { nproc; grep -m1 'model name' /proc/cpuinfo; node --version; } | tee bench/${{ matrix.game }}-machine.txt
      - name: The six builds, one after another, on this runner
        run: |
          ulimit -s unlimited || ulimit -s 65536
          set -o pipefail
          for w in base c1 c2 c3 noint nostep; do
            node --stack-size=30000 --max-old-space-size=6000 node/package-bench.mjs ${{ matrix.game }} pkg-$w bench/${{ matrix.game }}-$w.json --runs --aot-as-is --no-interp | tee bench/${{ matrix.game }}-$w.txt
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: b853m-${{ matrix.game }}
          path: bench/
